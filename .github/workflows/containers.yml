name: Build release containers

on:
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/containers.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Publish the tested images to GHCR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test pinned dnaprs containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build analysis image
        run: |
          docker build --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --file containers/analysis/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-analysis:1.0.1 \
            .

      - name: Build combined PLINK image
        run: |
          docker build --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --file containers/plink2/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-plink2:2.0.0-a.6.12-plink1.90b6.21 \
            .

      - name: Build report image
        run: |
          docker build --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --file containers/report/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-report:1.0.1 \
            .

      - name: Build target-imputation image
        run: |
          docker build --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --file containers/imputation/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-imputation:1.1.0 \
            .

      - name: Verify software versions
        run: |
          docker run --rm ghcr.io/paulyrp/dnaprs-analysis:1.0.1 \
            Rscript -e "stopifnot(as.character(getRversion()) == '4.4.1')"
          docker run --rm \
            --volume "$PWD:/work/dnaprs:ro" \
            --workdir /work/dnaprs \
            ghcr.io/paulyrp/dnaprs-analysis:1.0.1 \
            Rscript tests/scripts/check_r_dependencies.R analysis
          docker run --rm ghcr.io/paulyrp/dnaprs-plink2:2.0.0-a.6.12-plink1.90b6.21 \
            plink2 --version | grep 'v2.0.0-a.6.12'
          docker run --rm ghcr.io/paulyrp/dnaprs-plink2:2.0.0-a.6.12-plink1.90b6.21 \
            plink --version | grep 'v1.90b6.21'
          docker run --rm quay.io/biocontainers/plink2:2.0.0a.6.9--h9948957_0 \
            plink2 --version | grep 'v2.0.0-a.6.9'
          docker run --rm --entrypoint Rscript \
            docker.io/zhiliz/sbayesrc:0.2.6 \
            -e "stopifnot(as.character(packageVersion('SBayesRC')) == '0.2.6')"
          docker run --rm ghcr.io/paulyrp/dnaprs-report:1.0.1 \
            quarto --version | grep '^1.7.32$'
          docker run --rm \
            --volume "$PWD:/work/dnaprs:ro" \
            --workdir /work/dnaprs \
            ghcr.io/paulyrp/dnaprs-report:1.0.1 \
            Rscript tests/scripts/check_r_dependencies.R report
          docker run --rm ghcr.io/paulyrp/dnaprs-imputation:1.1.0 \
            bash -c "bcftools --version | head -n 1 && java -jar /opt/beagle/beagle.jar 2>&1 | head -n 2 && java -jar /opt/beagle/unbref3.jar help 2>&1 | head -n 2 && plink2 --version && Rscript -e \"stopifnot(as.character(packageVersion('data.table')) == '1.18.0')\""

      - name: Log in to GitHub Container Registry
        if: >-
          github.repository == 'paulYRP/dnaprs' &&
          ((github.event_name == 'release' &&
          (github.event.release.tag_name == '1.0.0' || github.event.release.tag_name == 'v1.0.0')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_images))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned images
        if: >-
          github.repository == 'paulYRP/dnaprs' &&
          ((github.event_name == 'release' &&
          (github.event.release.tag_name == '1.0.0' || github.event.release.tag_name == 'v1.0.0')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_images))
        run: |
          docker push ghcr.io/paulyrp/dnaprs-analysis:1.0.1
          docker push ghcr.io/paulyrp/dnaprs-plink2:2.0.0-a.6.12-plink1.90b6.21
          docker push ghcr.io/paulyrp/dnaprs-report:1.0.1
          docker push ghcr.io/paulyrp/dnaprs-imputation:1.1.0

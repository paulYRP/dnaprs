name: Run nf-test

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  push:
    branches:
      - dev
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NFT_VER: "0.9.5"
  NXF_ANSI_LOG: false

jobs:
  nf-test:
    name: Nextflow ${{ matrix.NXF_VER }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
    strategy:
      fail-fast: false
      matrix:
        # Test the pipeline's declared minimum and Nextflow's current edge
        # release. The minimum-version entry is also required by nf-core lint.
        NXF_VER: ["25.10.4", "latest-everything"]

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Set up nf-test
        uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2
        with:
          version: ${{ env.NFT_VER }}
          install-pdiff: true

      - name: Check local module contracts
        run: bash tests/scripts/check_local_modules.sh

      - name: Test verified reference caching
        run: bash tests/scripts/test_reference_asset.sh

      - name: Build pinned test containers
        if: ${{ matrix.NXF_VER == '25.10.4' }}
        run: |
          docker build --pull \
            --file containers/analysis/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-analysis:1.0.0 \
            .
          docker build --pull \
            --file containers/plink2/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-plink2:2.0.0-a.6.12-plink1.90b6.21 \
            .
          docker build --pull \
            --file containers/report/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-report:1.0.0 \
            .
          docker build --pull \
            --file containers/imputation/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-imputation:1.1.0 \
            .

      - name: Run minimal real-tool workflow test
        if: ${{ matrix.NXF_VER == '25.10.4' }}
        run: |
          mkdir -p nf-test-results
          nf-test test tests/default.nf.test \
            --profile test,docker \
            --ci \
            --verbose \
            --log nf-test-results/nf-test.log \
            --junitxml nf-test-results/junit.xml

      - name: Run complete stub graph test
        run: |
          mkdir -p nf-test-results
          nf-test test tests/stub.nf.test \
            --profile test_full \
            --ci \
            --verbose \
            --log nf-test-results/stub.log \
            --junitxml nf-test-results/stub.junit.xml

      - name: Run focused local-module stub tests
        run: |
          nf-test test 'modules/local/**/tests/*.nf.test' \
            --tag modules_stub \
            --profile test_full \
            --ci \
            --verbose \
            --log nf-test-results/modules.log \
            --junitxml nf-test-results/modules.junit.xml

      - name: Run focused local-module real tests
        if: ${{ matrix.NXF_VER == '25.10.4' }}
        run: |
          nf-test test 'modules/local/**/tests/*.nf.test' \
            --tag modules_real \
            --profile test,docker \
            --ci \
            --verbose \
            --log nf-test-results/modules-real.log \
            --junitxml nf-test-results/modules-real.junit.xml

      - name: Run input resolver compatibility test
        if: ${{ matrix.NXF_VER == 'latest-everything' }}
        run: |
          nf-test test modules/local/resolve_inputs/tests/real.nf.test \
            --profile test,docker \
            --ci \
            --verbose \
            --log nf-test-results/resolve-inputs.log \
            --junitxml nf-test-results/resolve-inputs.junit.xml

      - name: Run focused stage and reference tests
        if: ${{ matrix.NXF_VER == '25.10.4' }}
        run: |
          nf-test test tests/stages.nf.test tests/reference.nf.test tests/formats.nf.test tests/directory_inputs.nf.test \
            --profile test,docker \
            --ci \
            --verbose \
            --log nf-test-results/focused.log \
            --junitxml nf-test-results/focused.junit.xml

      - name: Run real chromosome-imputation test
        if: ${{ matrix.NXF_VER == '25.10.4' }}
        env:
          # Keep the temporary JAR below projectDir so Docker receives the same
          # bind mount used for the other synthetic reference fixtures.
          DNAPRS_TEST_BEAGLE_JAR: ${{ github.workspace }}/tests/data/reference/beagle.27Feb25.75f.jar
        run: |
          curl --fail --location --retry 5 \
            https://faculty.washington.edu/browning/beagle/beagle.27Feb25.75f.jar \
            --output "$DNAPRS_TEST_BEAGLE_JAR"
          echo "7319f4af9638be05c18dcc1bfb8fb41a58a09293507ebf0d54617d0e40df5a70  $DNAPRS_TEST_BEAGLE_JAR" | sha256sum --check --strict
          nf-test test tests/imputation.nf.test \
            --profile test,docker \
            --ci \
            --verbose \
            --log nf-test-results/imputation.log \
            --junitxml nf-test-results/imputation.junit.xml

      - name: Upload test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nf-test-nextflow-${{ matrix.NXF_VER }}
          path: nf-test-results/
          if-no-files-found: warn

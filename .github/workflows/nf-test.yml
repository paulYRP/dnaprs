name: Run nf-test

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  push:
    branches:
      - dev
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NFT_VER: "0.9.5"
  NXF_ANSI_LOG: false

jobs:
  nf-test:
    name: Nextflow ${{ matrix.NXF_VER }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "25.10.4"
          - "latest-everything"

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Set up nf-test
        uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2
        with:
          version: ${{ env.NFT_VER }}
          install-pdiff: true

      - name: Authenticate to the project container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the current imputation image
        run: |
          docker build --pull \
            --file containers/imputation/Dockerfile \
            --tag ghcr.io/paulyrp/dnaprs-imputation:1.1.0 \
            containers/imputation

      - name: Run minimal real-tool workflow test
        run: |
          mkdir -p nf-test-results
          nf-test test tests/default.nf.test \
            --profile +docker \
            --ci \
            --verbose \
            --log nf-test-results/nf-test.log \
            --junitxml nf-test-results/junit.xml

      - name: Run complete stub graph test
        if: ${{ matrix.NXF_VER == '25.10.4' }}
        run: |
          nf-test test tests/stub.nf.test \
            --profile +test_full \
            --ci \
            --verbose \
            --log nf-test-results/stub.log \
            --junitxml nf-test-results/stub.junit.xml

      - name: Run focused stage and reference tests
        if: ${{ matrix.NXF_VER == '25.10.4' }}
        run: |
          nf-test test tests/stages.nf.test tests/reference.nf.test \
            --profile +docker \
            --ci \
            --verbose \
            --log nf-test-results/focused.log \
            --junitxml nf-test-results/focused.junit.xml

      - name: Upload test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nf-test-nextflow-${{ matrix.NXF_VER }}
          path: nf-test-results/
          if-no-files-found: warn

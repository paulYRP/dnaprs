name: phenotype_association
description: Fit prespecified matching phenotype-PRS models and retain participant-level values, deterministic
  residual permutations, and case-deletion diagnostics.
keywords:
  - prs
  - phenotype
  - regression
  - diagnostics
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - glm2:
      description: Reliable fitting of generalised linear models
      identifier: ""
      homepage: https://cran.r-project.org/package=glm2
  - lme4:
      description: Linear and generalised linear mixed-effects models
      identifier: biotools:lme4
      homepage: https://lme4.github.io/lme4/
input:
  - - score_job:
        type: map
        description: PRS method, trait, and target cohort metadata.
    - scores_long:
        type: file
        description: Long-format participant PRS table.
    - phenotype_models:
        type: file
        description: Validated phenotype-model records.
    - model_id:
        type: string
        description: Identifier of the phenotype model fitted by this task.
  - phenotype_file:
      type: file
      description: Submitted phenotype CSV or delimited phenotype table.
  - association_script:
      type: file
      description: R script that fits phenotype associations and calculates diagnostics.
  - seed:
      type: integer
      description: Fixed random seed for reproducible permutation procedures.
output:
  associations:
    - "*.phenotype_associations.tsv":
        type: file
        description: Effect estimates, fit metrics, inclusion counts, diagnostics, and status.
  fitted_models:
    - "*.phenotype_models_fitted.tsv":
        type: file
        description: Prespecified model formulas and fitted-model diagnostics.
  plot_data:
    - "*.phenotype_plot_data.tsv":
        type: file
        description: Participant-level values used by phenotype figures.
  permutations:
    - "*.phenotype_permutations.tsv":
        type: file
        description: Deterministic permutation results.
  influence:
    - "*.phenotype_influence.tsv":
        type: file
        description: Participant influence and case-deletion diagnostics.
  phenotype_prs:
    - "*.phenoPRS.csv":
        type: file
        description: Legacy CSV copy of phenotype rows joined to participant PRSs.
  phenotype_with_prs:
    - "*.phenotype_with_prs.tsv":
        type: file
        description: All source phenotype rows, participant decisions, and raw and standardised PRSs in source order.
  participant_level:
    - "*.phenotype_participant_level.tsv":
        type: file
        description: One selected analysis record per participant and requested timepoint.
  timepoint_completeness:
    - "*.phenotype_timepoint_completeness.tsv":
        type: file
        description: Availability and selected source row for every participant and requested timepoint.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_glm2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - glm2:
          type: string
          description: The name of the tool
      - ? Rscript -e 'if (requireNamespace("glm2", quietly=TRUE)) cat(as.character(packageVersion("glm2")))
          else cat("not-used")' 2>/dev/null || printf stub
        : type: eval
          description: The expression to obtain the version of the tool
  versions_lme4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - lme4:
          type: string
          description: The name of the tool
      - ? Rscript -e 'if (requireNamespace("lme4", quietly=TRUE)) cat(as.character(packageVersion("lme4")))
          else cat("not-used")' 2>/dev/null || printf stub
        : type: eval
          description: The expression to obtain the version of the tool

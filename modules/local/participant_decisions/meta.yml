name: participant_decisions
description: Integrate technical QC, relatedness, and reference ancestry into explicit participant decisions.
keywords:
  - genotype
  - quality-control
  - ancestry
  - relatedness
tools:
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - - meta:
        type: map
        description: Target cohort metadata.
    - sample_decisions:
        type: list
        description: Sample-level decisions from target QC checkpoints.
    - eda_tables:
        type: list
        description: Post-QC heterozygosity and PLINK 1 identity-by-descent tables plus the raw sex-check table.
    - target_ancestry:
        type: file
        description: Projected ancestry assignments and distance flags for target participants.
  - decision_script:
      type: file
      description: R script that integrates technical, relatedness, and ancestry decisions.
output:
  decisions:
    - - meta:
          type: map
          description: Metadata associated with participant decisions and score-eligible plink keep file.
      - ${meta.cohort}.participant_decisions.tsv:
          type: file
          description: Technical, relatedness, ancestry, scoring, and primary-analysis decisions for each participant.
      - ${meta.cohort}.score_eligible.keep:
          type: file
          description: Two-column PLINK keep file for score-eligible participants.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:

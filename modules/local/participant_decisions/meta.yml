name: participant_decisions
description: Integrate technical QC, relatedness, and reference ancestry into explicit participant decisions.
keywords:
  - genotype
  - quality-control
  - ancestry
  - relatedness
tools:
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: Software dependency reported by the `participant_decisions` process
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - - meta:
        type: map
        description: Metadata associated with inputs required by the `participant_decisions` process.
    - sample_decisions:
        type: string
        description: Inputs required by the `participant_decisions` process.
    - eda_tables:
        type: string
        description: Inputs required by the `participant_decisions` process.
    - target_ancestry:
        type: string
        description: Inputs required by the `participant_decisions` process.
  - decision_script:
      type: file
      description: Executable script used to produce r implementation used to integrate participant decisions.
output:
  decisions:
    - - meta:
          type: map
          description: Metadata associated with participant decisions and score-eligible plink keep file.
      - ${meta.cohort}.participant_decisions.tsv:
          type: file
          description: Participant decisions and score-eligible PLINK keep file.
      - ${meta.cohort}.score_eligible.keep:
          type: file
          description: Participant decisions and score-eligible PLINK keep file.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:

name: harmonise_gwas
description: Convert a QC-completed GWAS to explicit COJO and PLINK clumping formats.
keywords:
  - gwas
  - harmonisation
  - prs
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - - meta:
        type: map
        description: Metadata associated with inputs required by the `harmonise_gwas` process.
    - gwas_file:
        type: file
        description: Inputs required by the `harmonise_gwas` process.
  - harmonise_script:
      type: file
      description: Executable script used to produce r implementation used to validate and harmonise the
        gwas.
output:
  harmonised:
    - - meta:
          type: map
          description: Metadata associated with cojo and clumping inputs plus harmonisation qc.
      - ${meta.trait_id}.cojo.ma:
          type: file
          description: COJO and clumping inputs plus harmonisation QC.
      - ${meta.trait_id}.clump.tsv:
          type: file
          description: COJO and clumping inputs plus harmonisation QC.
      - ${meta.trait_id}.harmonisation_qc.tsv:
          type: file
          description: COJO and clumping inputs plus harmonisation QC.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:

name: harmonise_gwas
description: Convert a QC-completed GWAS to explicit COJO and PLINK clumping formats.
keywords:
  - gwas
  - harmonisation
  - prs
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
  - r.utils:
      description: R utilities used by data.table to read compressed GWAS files
      identifier: ""
      homepage: https://cran.r-project.org/package=R.utils
input:
  - - meta:
        type: map
        description: GWAS trait, build, effect scale, and source-column metadata.
    - gwas_file:
        type: file
        description: Raw GWAS summary-statistic file.
  - harmonise_script:
      type: file
      description: R script that validates and harmonises GWAS summary statistics.
output:
  harmonised:
    - - meta:
          type: map
          description: Metadata for the harmonised GWAS.
      - ${meta.trait_id}.cojo.ma:
          type: file
          description: Harmonised COJO summary statistics.
      - ${meta.trait_id}.clump.tsv:
          type: file
          description: Harmonised PLINK clumping input.
      - ${meta.trait_id}.harmonisation_qc.tsv:
          type: file
          description: GWAS harmonisation quality-control counts and thresholds.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r_utils:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R.utils:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("R.utils")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool

name: validate_manifests
description: Validate generated dnaprs input records and resolve declared source paths before computation.
keywords:
  - prs
  - input-records
  - validation
tools:
  - r:
      description: R statistical computing environment
      homepage: https://www.r-project.org/
      identifier: ""
input:
  - run_name:
      type: string
      description: Stable name used for this pipeline run.
  - target_manifest:
      type: file
      description: Generated target-cohort records from input resolution.
  - gwas_manifest:
      type: file
      description: Generated GWAS records from input resolution.
  - reference_manifest:
      type: file
      description: Generated records for declared or resolved reference sources.
  - phenotype_file:
      type: file
      description: Phenotype table or the pipeline empty placeholder.
  - phenotype_models:
      type: file
      description: Generated phenotype-model records or the pipeline empty placeholder.
  - target_assets:
      type: list
      description: Target genotype files staged so the validator can inspect paths outside the pipeline directory.
  - gwas_assets:
      type: list
      description: GWAS files staged so the validator can inspect paths outside the pipeline directory.
  - reference_assets:
      type: list
      description: Reference files and directories staged for integrity and content validation.
  - methods:
      type: list
      description: PRS methods that determine method-specific validation requirements.
  - genome_build:
      type: string
      description: Genome build required across targets, GWAS records, and references.
  - seed:
      type: integer
      description: Random seed recorded in the validated run settings.
  - report_enabled:
      type: boolean
      description: Whether the selected stage includes report generation.
  - target_imputation:
      type: boolean
      description: Whether chromosome-level target imputation is enabled.
  - launch_dir:
      type: string
      description: Launch directory used to resolve relative target, GWAS, and phenotype paths.
  - reference_base:
      type: string
      description: Base directory used to resolve relative paths in generated reference records.
  - run_plan:
      type: file
      description: Validated stage and reference-role plan.
  - validator_script:
      type: file
      description: R script that validates records, paths, checksums, and run settings.
output:
  target_manifest:
    - targets.tsv:
        type: file
        description: Validated target-cohort records with resolved paths.
  gwas_manifest:
    - gwas.tsv:
        type: file
        description: Validated GWAS records with resolved paths and source columns.
  reference_manifest:
    - references.tsv:
        type: file
        description: Validated reference records with integrity status.
  phenotype_models:
    - models.tsv:
        type: file
        description: Validated phenotype-model records.
  run_plan:
    - run_plan.tsv:
        type: file
        description: Validated copy of the stage plan.
  run_settings:
    - run_settings.yml:
        type: file
        description: Run settings used by the workflow.
  input_checksums:
    - input_checksums.tsv:
        type: file
        description: SHA-256 checksums for file inputs suitable for direct hashing.
  input_checks:
    - input_checks.tsv:
        type: file
        description: Essential input validation results.
  reference_integrity:
    - reference_integrity.tsv:
        type: file
        description: Declared and observed reference digests with authentication status.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

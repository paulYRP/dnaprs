name: combine_scores
description: Combine method scores, calculate within-cohort standard scores, and compare methods without
  selecting a winner from target phenotypes.
keywords:
  - prs
  - standardisation
  - concordance
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: Software dependency reported by the `combine_scores` process
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - score_files:
      type: file
      description: Participant score tables produced by enabled PRS methods.
  - participant_decisions:
      type: file
      description: Cohort participant inclusion decisions.
  - combine_script:
      type: file
      description: Executable script used to produce r implementation used to combine and standardise scores.
output:
  scores_long:
    - prs_scores_long.tsv:
        type: file
        description: Long-format participant PRS table.
  scores_wide:
    - prs_scores_wide.tsv:
        type: file
        description: Wide-format participant PRS table.
  score_qc:
    - score_qc.tsv:
        type: file
        description: Score completeness and coverage audit.
  concordance:
    - method_concordance.tsv:
        type: file
        description: Cross-method score concordance table.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:

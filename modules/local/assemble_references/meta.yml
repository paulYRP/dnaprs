name: assemble_references
description: Assemble validated local and downloaded assets into one reusable reference bundle.
keywords:
  - reference
  - cache
  - provenance
tools:
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - asset_rows:
      type: list
      description: Planned catalogue asset records to add to the reference bundle.
  - asset_files:
      type: list
      description: Validated files acquired for the planned catalogue assets.
  - provided_references:
      type: file
      description: Declared local reference records to retain in the bundle.
  - reference_bundle:
      type: string
      description: Versioned identifier assigned to the assembled reference bundle.
  - genome_build:
      type: string
      description: Genome build shared by all reference records.
  - cache_root:
      type: string
      description: Persistent directory containing validated reference assets.
  - assemble_script:
      type: file
      description: R script that assembles and validates the reference bundle.
output:
  references:
    - references.tsv:
        type: file
        description: Generated canonical reference records.
  bundle:
    - reference_bundle:
        type: directory
        description: Validated reference bundle.
  receipt:
    - reference_receipt.tsv:
        type: file
        description: Reference source, checksum, size, and cache receipt.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

name: summarise_generation_qc
description: Combine GWAS, method, and target-scoring variant counts into one ordered audit table.
keywords:
  - prs
  - variants
  - quality-control
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: Fast tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - generation_qc_files:
      type: file
      description: Ordered GWAS, reference, method, and scoring QC records.
  - score_qc:
      type: file
      description: Combined participant score QC.
  - generation_qc_script:
      type: file
      description: Executable script used to produce r implementation used to construct the variant-flow
        audit.
output:
  variant_flow:
    - variant_flow.tsv:
        type: file
        description: Ordered per-trait and per-method variant-flow table.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool

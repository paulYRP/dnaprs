name: render_report
description: Render the portable conditional dnaprs report with contextual result and figure downloads.
keywords:
  - prs
  - report
  - tiff
  - png
  - jpeg
  - dictionary
  - visualisation
  - phenotype
tools:
  - quarto:
      description: Scientific publishing system
      identifier: ""
      homepage: https://quarto.org/
  - ggplot2:
      description: Grammar of graphics for R
      identifier: biotools:ggplot2
      homepage: https://ggplot2.tidyverse.org/
  - openssl:
      description: SHA-256 calculation for the report file dictionary
      identifier: ""
      homepage: https://docs.ropensci.org/openssl/
  - jsonlite:
      description: Figure-gallery data embedded in each report page
      identifier: ""
      homepage: https://jeroen.r-universe.dev/jsonlite/
input:
  - report_files:
      type: file
      description: Pipeline result, QC, log, and provenance files used by the report.
  - output_manifest:
      type: file
      description: Stable manifest of published pipeline outputs.
  - report_source:
      type: directory
      description: Quarto report source directory.
output:
  pages:
    - reports/*.html:
        type: file
        description: Rendered report HTML pages.
  libraries:
    - reports/site_libs:
        type: directory
        description: Local JavaScript and CSS dependencies.
  assets:
    - reports/assets:
        type: directory
        description: Report logos and static assets.
  downloads:
    - reports/downloads:
        type: directory
        description: Optional downloadable result tables.
  figures:
    - reports/figures:
        type: directory
        description: Optional report figure bundle.
  provenance:
    - reports/provenance/*:
        type: file
        description: Embedded Nextflow execution and software provenance.
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

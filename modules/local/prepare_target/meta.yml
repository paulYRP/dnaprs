name: prepare_target
description: Import raw or checkpointed target genotypes, apply source marker references, and create PGEN
  datasets.
keywords:
  - plink
  - genotype
  - prs
tools:
  - bcftools:
      description: Utilities for variant calling and manipulating VCF and BCF files
      identifier: biotools:bcftools
      homepage: https://samtools.github.io/bcftools/
  - plink2:
      description: Whole-genome association and genotype-processing toolset
      identifier: ""
      homepage: https://www.cog-genomics.org/plink/2.0/
  - R:
      description: Statistical computing environment used for marker resolution
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - - meta:
        type: map
        description: Metadata associated with inputs required by the `prepare_target` process.
    - target_files:
        type: list
        description: Inputs required by the `prepare_target` process.
  - - dbsnp:
        type: map
        description: Metadata associated with inputs required by the `prepare_target` process.
    - dbsnp_files:
        type: list
        description: Inputs required by the `prepare_target` process.
  - - reference_fasta:
        type: map
        description: Metadata associated with inputs required by the `prepare_target` process.
    - reference_fasta_files:
        type: list
        description: Inputs required by the `prepare_target` process.
  - prepare_script:
      type: file
      description: Executable script used to produce inputs required by the `prepare_target` process.
  - adapter_script:
      type: file
      description: Executable script used to produce inputs required by the `prepare_target` process.
  - marker_resolver:
      type: file
      description: Inputs required by the `prepare_target` process.
output:
  prepared:
    - - meta:
          type: map
          description: Metadata associated with target metadata, corrected pgen directory, and preparation
            summary.
      - ${meta.cohort}:
          type: directory
          description: Target metadata, corrected PGEN directory, and preparation summary.
      - ${meta.cohort}.target_prep_summary.tsv:
          type: file
          description: Target metadata, corrected PGEN directory, and preparation summary.
  prep:
    - - meta:
          type: map
          description: Metadata associated with target metadata and preparation summary.
      - ${meta.cohort}.target_prep_summary.tsv:
          type: file
          description: Target metadata and preparation summary.
  marker_decisions:
    - - meta:
          type: map
          description: Metadata associated with deterministic marker and duplicate-probe audit table.
      - ${meta.cohort}.marker_decisions.tsv:
          type: file
          description: Deterministic marker and duplicate-probe audit table.
  checkpoint:
    - - meta:
          type: map
          description: Metadata associated with reusable corrected pgen checkpoint and manifest.
      - ${meta.cohort}:
          type: directory
          description: Reusable corrected PGEN checkpoint and manifest.
      - ${meta.cohort}.corrected_target_manifest.tsv:
          type: file
          description: Reusable corrected PGEN checkpoint and manifest.
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:

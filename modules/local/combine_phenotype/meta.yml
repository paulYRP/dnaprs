name: combine_phenotype
description: Deterministically gather independently fitted phenotype models.
keywords:
  - phenotype
  - prs
  - gather
tools:
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - associations:
      type: file
      description: Per-model phenotype association estimates.
  - fitted_models:
      type: file
      description: Per-model fitted-model specifications.
  - plot_data:
      type: file
      description: Per-model report plot data.
  - permutations:
      type: file
      description: Per-model permutation results.
  - influence:
      type: file
      description: Per-model influence diagnostics.
  - phenotype_prs:
      type: file
      description: Per-model legacy phenotype and PRS tables.
  - phenotype_with_prs:
      type: file
      description: Per-model row-level phenotype and PRS tables.
  - participant_level:
      type: file
      description: Per-model selected participant and timepoint records.
  - timepoint_completeness:
      type: file
      description: Per-model requested-timepoint completeness records.
  - combine_script:
      type: file
      description: R script that validates and gathers phenotype results across model tasks.
output:
  associations:
    - phenotype_associations.tsv:
        type: file
        description: Combined phenotype association estimates.
  fitted_models:
    - phenotype_models_fitted.tsv:
        type: file
        description: Combined fitted-model specifications.
  plot_data:
    - phenotype_plot_data.tsv:
        type: file
        description: Combined report plot data.
  permutations:
    - phenotype_permutations.tsv:
        type: file
        description: Combined permutation results.
  influence:
    - phenotype_influence.tsv:
        type: file
        description: Combined influence diagnostics.
  phenotype_prs:
    - phenoPRS.csv:
        type: file
        description: Legacy CSV copy of combined row-level phenotype and PRS data.
  phenotype_with_prs:
    - phenotype_with_prs.tsv:
        type: file
        description: All phenotype rows with participant decisions and raw and standardised PRSs.
  participant_level:
    - phenotype_participant_level.tsv:
        type: file
        description: Selected participant-level records used to prepare phenotype models.
  timepoint_completeness:
    - phenotype_timepoint_completeness.tsv:
        type: file
        description: Requested-timepoint availability and selected source rows.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:

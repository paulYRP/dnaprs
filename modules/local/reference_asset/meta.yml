name: reference_asset
description: Fetch or reuse one pinned reference asset and verify its declared integrity metadata.
keywords:
  - reference
  - download
  - checksum
  - cache
tools:
  - curl:
      description: Command-line data transfer tool
      identifier: ""
      homepage: https://curl.se/
input:
  - - row:
        type: map
        description: Pinned asset URL, digest, size, role, and cache metadata.
    - cached:
        type: file
        description: Existing cached asset, or the empty placeholder when acquisition is required.
    - cache_target:
        type: string
        description: Validated destination path in the persistent reference cache.
  - embedded_fasta_index:
      type: file
      description: Bundled FASTA index used only for the matching catalogue asset.
  - asset_script:
      type: file
      description: Shell script that downloads, verifies, and atomically caches one reference asset.
output:
  asset:
    - - row:
          type: map
          description: Metadata associated with catalogue metadata and verified reference asset.
      - ${row.asset_id}:
          type: directory
          description: Catalogue metadata and verified reference asset.
  versions_curl:
    - - ${task.process}:
          type: string
          description: The name of the process
      - curl:
          type: string
          description: The name of the tool
      - command -v curl >/dev/null && curl --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - curl:
          type: string
          description: The name of the tool
      - command -v curl >/dev/null && curl --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

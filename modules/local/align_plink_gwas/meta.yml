name: align_plink_gwas
description: Align harmonised GWAS identifiers and alleles to the PLINK LD reference.
keywords:
  - gwas
  - harmonisation
  - plink
  - prs
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - - meta:
        type: map
        description: GWAS trait and PRS metadata.
    - cojo:
        type: file
        description: Harmonised GWAS table in COJO format.
    - clump_input:
        type: file
        description: Harmonised GWAS table prepared for PLINK clumping.
    - harmonisation_qc:
        type: file
        description: QC summary from GWAS harmonisation.
    - reference:
        type: map
        description: LD reference identifier, type, and source metadata.
    - reference_files:
        type: list
        description: LD reference genotype files used for coordinate and allele alignment.
  - align_script:
      type: file
      description: R script that aligns GWAS coordinates and alleles to the LD reference.
output:
  aligned:
    - - meta:
          type: map
          description: Metadata associated with reference-aligned cojo and clumping tables with common qc.
      - ${meta.trait_id}.plink.cojo.ma:
          type: file
          description: Reference-aligned COJO and clumping tables with common QC.
      - ${meta.trait_id}.plink.clump.tsv:
          type: file
          description: Reference-aligned COJO and clumping tables with common QC.
      - harmonisation_qc:
          type: file
          description: Reference-aligned COJO and clumping tables with common QC.
  qc:
    - - meta:
          type: map
          description: Metadata associated with counts of aligned, absent, ambiguous, duplicate, and complemented
            variants.
      - ${meta.trait_id}.plink.reference_alignment_qc.tsv:
          type: file
          description: Counts of aligned, absent, ambiguous, duplicate, and complemented variants.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

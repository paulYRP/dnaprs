name: align_plink_gwas
description: Align one GWAS to the shared target and European reference compatibility index.
keywords:
  - genotype
  - prs
  - reference
tools:
  - "R":
      description: "Statistical computing."
      homepage: "https://www.r-project.org/"
  - "data.table":
      description: "Keyed table operations."
      homepage: "https://rdatatable.gitlab.io/data.table/"
input:
  - - "target":
        type: map
        description: "Target cohort and scoring-stage metadata."
    - "reference":
        type: map
        description: "Prepared European reference metadata."
    - "compatibility_index":
        type: file
        description: "Shared canonical allele index, including ambiguous target and reference key counts."
    - "meta":
        type: map
        description: "Target cohort, source format, build, role and input-stage metadata."
    - "cojo":
        type: file
        description: "Harmonised GWAS in COJO format."
    - "clump_input":
        type: file
        description: "Harmonised clumping input, also used by the stub."
    - "harmonisation_qc":
        type: file
        description: "Harmonisation QC table passed to clumping."
  - "align_script":
      type: file
      description: "Staged implementation script."
output:
  aligned:
    - - "target":
          type: map
          description: "Target cohort and scoring-stage metadata."
      - "meta":
          type: map
          description: "Target cohort, source format, build, role and input-stage metadata."
      - "${meta.trait_id}.plink.cojo.ma":
          type: file
          description: "GWAS effects and frequencies aligned to unique target/reference variants."
      - "${meta.trait_id}.plink.clump.tsv":
          type: file
          description: "Aligned variant identifiers, effect alleles and p-values for PLINK clumping."
      - "harmonisation_qc":
          type: file
          description: "Harmonisation QC table passed to clumping."
  qc:
    - - "target":
          type: map
          description: "Target cohort and scoring-stage metadata."
      - "meta":
          type: map
          description: "Target cohort, source format, build, role and input-stage metadata."
      - "${meta.trait_id}.plink.reference_alignment_qc.tsv":
          type: file
          description: "Trait-specific alignment counts, allele flips and exclusion reasons."
  versions_r:
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "R":
          type: string
          description: "Recorded value."
      - "Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub":
          type: eval
          description: "Command that reports the software version."
  versions_data_table:
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "data.table":
          type: string
          description: "Recorded value."
      - 'Rscript -e ''cat(as.character(packageVersion("data.table")))'' 2>/dev/null || printf stub':
          type: eval
          description: "Command that reports the software version."
topics:
  versions:
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "R":
          type: string
          description: "Recorded value."
      - "Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub":
          type: eval
          description: "Command that reports the software version."
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "data.table":
          type: string
          description: "Recorded value."
      - 'Rscript -e ''cat(as.character(packageVersion("data.table")))'' 2>/dev/null || printf stub':
          type: eval
          description: "Command that reports the software version."
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

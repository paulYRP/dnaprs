name: collect_versions
description: Combine process-level version records into one collision-free run manifest.
keywords:
  - versions
  - provenance
  - nextflow
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - yaml:
      description: YAML parsing and serialization for R
      identifier: ""
      homepage: https://cran.r-project.org/package=yaml
input:
  - version_files:
      type: file
      description: Process-level YAML software-version records.
  - collect_script:
      type: file
      description: Executable script used to produce r implementation used to validate and order version
        records.
output:
  versions:
    - software_versions.yml:
        type: file
        description: Deterministically combined software-version manifest.
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

name: reference_ancestry
description: Project target participants onto population-reference PCs and classify European-reference distance.
keywords: [ancestry, pca, genotype]
tools:
  - plink2:
      description: Whole-genome association and genotype-processing toolset
  - R:
      description: Statistical computing environment
input:
  - meta:
      type: map
      description: Target-cohort metadata.
  - target_dir:
      type: directory
      description: QC-completed target genotype dataset.
  - target_qc:
      type: file
      description: Target genotype QC summary.
  - reference:
      type: map
      description: Prepared population-reference metadata.
  - reference_dir:
      type: directory
      description: Prepared population-reference genotype dataset.
  - ancestry_script:
      type: file
      description: Shell implementation used for reference PCA projection.
  - classifier_script:
      type: file
      description: R implementation used for ancestry classification.
  - ancestry_pcs:
      type: value
      description: Number of principal components.
  - ancestry_percentile:
      type: value
      description: Reference-distance classification percentile.
output:
  - target:
      type: file
      description: Target PC projection, distance, threshold, and classification.
  - reference:
      type: file
      description: Population-reference projection and labels.
  - summary:
      type: file
      description: Reference matching and target classification summary.
  - logs:
      type: tuple
      description: PLINK ancestry-projection log.
  - versions:
      type: file
      description: Software versions used by the task.
authors: ["@paulYRP"]

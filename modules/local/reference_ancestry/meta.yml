name: reference_ancestry
description: Project target participants onto population-reference PCs and classify European-reference
  distance.
keywords:
  - ancestry
  - pca
  - genotype
tools:
  - plink2:
      description: Whole-genome association and genotype-processing toolset
      identifier: ""
      homepage: https://www.cog-genomics.org/plink/2.0/
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - - meta:
        type: map
        description: Target cohort metadata.
    - target_dir:
        type: directory
        description: Quality-controlled target PGEN dataset.
    - target_qc:
        type: file
        description: Target QC summary associated with the selected checkpoint.
    - reference:
        type: map
        description: Prepared ancestry reference identifier and build metadata.
    - reference_dir:
        type: directory
        description: Prepared unrelated reference panel and population labels.
  - ancestry_script:
      type: file
      description: Shell script that calculates reference PCA and projects target participants.
  - classifier_script:
      type: file
      description: R script that classifies projected ancestry from reference distances.
  - ancestry_pcs:
      type: integer
      description: Number of principal components.
  - ancestry_percentile:
      type: float
      description: Reference-distance classification percentile.
output:
  target:
    - - meta:
          type: file
          description: Metadata associated with target pc projection, distance, threshold, and classification.
      - ${meta.cohort}.target_ancestry.tsv:
          type: file
          description: Target PC projection, distance, threshold, and classification.
  reference:
    - - meta:
          type: file
          description: Metadata associated with population-reference projection and labels.
      - ${meta.cohort}.reference_projection.tsv:
          type: file
          description: Population-reference projection and labels.
  summary:
    - - meta:
          type: file
          description: Metadata associated with reference matching and target classification summary.
      - ${meta.cohort}.ancestry_summary.tsv:
          type: file
          description: Reference matching and target classification summary.
  logs:
    - - meta:
          type: map
          description: Metadata associated with plink ancestry-projection log.
      - ${meta.cohort}.reference_ancestry.log:
          type: file
          description: PLINK ancestry-projection log.
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

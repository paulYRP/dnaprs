name: prepare_sbayesrc_reference
description: Extract and validate downloaded SBayesRC LD and annotation archives.
keywords:
  - reference
  - sbayesrc
  - ld
  - annotation
  - prs
tools:
  - unzip:
      description: Extract ZIP archives
      identifier: ""
      homepage: https://infozip.sourceforge.net/UnZip.html
input:
  - - ld_source:
        type: map
        description: SBayesRC LD reference identifier, archive type, and source metadata.
    - ld_files:
        type: list
        description: SBayesRC LD reference archive and checksum receipt.
  - - annotation_source:
        type: map
        description: SBayesRC annotation reference identifier, archive type, and source metadata.
    - annotation_files:
        type: list
        description: SBayesRC annotation archive and checksum receipt.
  - prepare_script:
      type: file
      description: Shell script that extracts and validates SBayesRC reference assets.
output:
  ld:
    - - ld_source:
          type: map
          description: Metadata associated with prepared sbayesrc ld-reference directory.
      - prepared_sbayesrc/ld:
          type: directory
          description: Prepared SBayesRC LD-reference directory.
  annotation:
    - - annotation_source:
          type: map
          description: Metadata associated with prepared sbayesrc annotation file.
      - prepared_sbayesrc/annotation/annotation.txt:
          type: file
          description: Prepared SBayesRC annotation file.
  summary:
    - prepared_sbayesrc.summary.tsv:
        type: file
        description: Reference preparation and validation summary.
  versions_unzip:
    - - ${task.process}:
          type: string
          description: The name of the process
      - unzip:
          type: string
          description: The name of the tool
      - command -v unzip >/dev/null && unzip -v 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - unzip:
          type: string
          description: The name of the tool
      - command -v unzip >/dev/null && unzip -v 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

name: reference_plan
description: Resolve required reference roles to validated local assets or pinned downloads.
keywords:
  - reference
  - planning
  - cache
tools:
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - provided_references:
      type: file
      description: Normalised local reference records.
  - catalogue:
      type: file
      description: Pinned automatic-reference catalogue.
  - run_plan:
      type: file
      description: Stage-specific required reference roles.
  - reference_mode:
      type: string
      description: Local, automatic, or download reference mode.
  - plan_script:
      type: file
      description: R script that resolves required reference roles against the pinned catalogue.
output:
  assets:
    - reference_assets.tsv:
        type: file
        description: Asset acquisition plan.
  plan:
    - reference_plan.tsv:
        type: file
        description: Human-readable reference plan and status.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

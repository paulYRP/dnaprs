name: plink_reference_freq
description: Calculate fixed allele frequencies in the declared PLINK LD reference.
keywords: [plink, allele-frequency, reference]
tools:
  - plink2:
      description: Whole-genome association and genotype-processing toolset
input:
  - reference:
      type: map
      description: PLINK LD-reference metadata.
  - reference_files:
      type: directory
      description: Prepared PLINK LD-reference dataset.
output:
  - frequency:
      type: tuple
      description: Fixed reference allele counts and PLINK log.
  - versions:
      type: file
      description: Software versions used by the task.
authors: ["@paulYRP"]

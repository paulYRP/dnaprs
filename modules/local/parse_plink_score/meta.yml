name: parse_plink_score
description: Convert a completed PLINK score file into the dnaprs score and QC contracts.
keywords:
  - prs
  - plink
  - score
tools:
  - r:
      description: A language and environment for statistical computing.
      homepage: https://www.r-project.org/
      identifier: ""
  - data.table:
      description: High-performance tabular data processing for R.
      homepage: https://r-datatable.com/
      identifier: ""
input:
  - - target:
        type: map
        description: Target cohort and scoring-stage metadata.
    - gwas:
        type: map
        description: GWAS trait and PRS metadata.
    - score:
        type: file
        description: Raw PLINK participant score table.
    - used:
        type: file
        description: PLINK table of scoring variants present in the target.
    - score_log:
        type: file
        description: PLINK scoring execution log.
    - weight:
        type: file
        description: C+T score weight table supplied to PLINK.
    - target_pvar:
        type: file
        description: Target PVAR file used to audit compatible scoring variants.
  - parser_script:
      type: file
      description: R script that converts PLINK score output to the dnaprs score schema.
  - audit_script:
      type: file
      description: R script that audits weight, target-compatible, and used scoring variants.
output:
  scores:
    - - target:
          type: map
          description: Metadata associated with participant scores and their score-level qc summary.
      - gwas:
          type: map
          description: Metadata associated with participant scores and their score-level qc summary.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.score.tsv":
          type: file
          description: Participant scores and their score-level QC summary.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.score_qc.tsv":
          type: file
          description: Participant scores and their score-level QC summary.
  compatibility:
    - - target:
          type: map
          description: Metadata associated with variant-level compatibility audit and score coverage summary.
      - gwas:
          type: map
          description: Metadata associated with variant-level compatibility audit and score coverage summary.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.variant_compatibility.tsv":
          type: file
          description: Variant-level compatibility audit and score coverage summary.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.variant_coverage.tsv":
          type: file
          description: Variant-level compatibility audit and score coverage summary.
  logs:
    - - target:
          type: map
          description: Metadata associated with plink scoring log carried forward unchanged.
      - gwas:
          type: map
          description: Metadata associated with plink scoring log carried forward unchanged.
      - score_log:
          type: file
          description: PLINK scoring log carried forward unchanged.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:

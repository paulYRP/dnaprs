name: resolve_inputs
description: Discover raw target and GWAS inputs or normalise nested YAML declarations into internal records.
keywords:
  - input
  - discovery
  - yaml
  - validation
tools:
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - jsonlite:
      description: JSON parsing for encoded Nextflow parameter values
      identifier: ""
      homepage: https://jeroen.r-universe.dev/jsonlite/
  - openssl:
      description: Base64 decoding for encoded Nextflow parameter values
      identifier: ""
      homepage: https://cran.r-project.org/package=openssl
  - yaml:
      description: Serialisation of resolved reference settings
      identifier: ""
      homepage: https://cran.r-project.org/package=yaml
input:
  - input_spec:
      type: string
      description: Base64-encoded target input declaration.
  - gwas_spec:
      type: string
      description: Base64-encoded GWAS input declaration.
  - reference_spec:
      type: string
      description: Base64-encoded reference declaration.
  - models_spec:
      type: string
      description: Base64-encoded phenotype model declaration.
  - genome_build:
      type: string
      description: Genome build required for target, GWAS, and reference records.
  - methods:
      type: list
      description: PRS methods selected for the run.
  - target_imputation:
      type: boolean
      description: Whether to plan chromosome-level target imputation.
  - stop_after:
      type: string
      description: Last workflow stage selected for the run.
  - reference_only:
      type: boolean
      description: Whether to prepare references without processing a target cohort.
  - reference_mode:
      type: string
      description: Strategy for resolving local and downloadable reference assets.
  - reference_bundle:
      type: string
      description: Versioned reference bundle identifier.
  - phenotype:
      type: string
      description: Phenotype table path, or an empty value when phenotype analysis is disabled.
  - outcome:
      type: string
      description: Phenotype outcome column used by the single-model interface.
  - covariates:
      type: string
      description: Comma-separated covariate columns used by the single-model interface.
  - model_type:
      type: string
      description: Statistical model family used by the single-model interface.
  - participant_id:
      type: string
      description: Phenotype-table column containing target participant identifiers.
  - group_column:
      type: string
      description: Grouping column required by mixed models.
  - control_value:
      type: string
      description: Phenotype value mapped to the control class in binomial models.
  - case_value:
      type: string
      description: Phenotype value mapped to the case class in binomial models.
  - beagle_jar:
      type: string
      description: Optional explicit path to the Beagle JAR.
  - unbref3_jar:
      type: string
      description: Optional explicit path to the unbref3 JAR.
  - target_source:
      type: file
      description: Staged target directory, or the empty placeholder for explicit records.
  - gwas_source:
      type: file
      description: Staged GWAS directory, or the empty placeholder for explicit records.
  - reference_source:
      type: file
      description: Staged reference directory, or the empty placeholder for automatic references.
  - resolver_script:
      type: file
      description: R script that discovers inputs and writes validated internal records.
output:
  targets:
    - targets.tsv:
        type: file
        description: Internally generated target records.
  gwas:
    - gwas.tsv:
        type: file
        description: Internally generated GWAS records.
  references:
    - references.tsv:
        type: file
        description: Internally generated local-reference records.
  models:
    - models.tsv:
        type: file
        description: Internally generated phenotype-model records.
  run_plan:
    - run_plan.tsv:
        type: file
        description: Stage decisions and required reference roles.
  settings:
    - reference_settings.yml:
        type: file
        description: Normalised reference settings.
  checks:
    - input_resolution.tsv:
        type: file
        description: Input discovery and normalisation checks.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_jsonlite:
    - - ${task.process}:
          type: string
          description: The name of the process
      - jsonlite:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("jsonlite")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_openssl:
    - - ${task.process}:
          type: string
          description: The name of the process
      - openssl:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("openssl")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_yaml:
    - - ${task.process}:
          type: string
          description: The name of the process
      - yaml:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("yaml")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool

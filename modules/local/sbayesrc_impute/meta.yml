name: sbayesrc_impute
description: Impute missing GWAS summary statistics to the SBayesRC LD panel using package defaults.
keywords:
  - sbayesrc
  - summary-statistics
  - imputation
tools:
  - sbayesrc:
      description: Bayesian multiple regression using summary statistics
      identifier: ""
      homepage: https://github.com/zhilizheng/SBayesRC
  - R:
      description: Software dependency reported by the `sbayesrc_impute` process
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - - meta:
        type: map
        description: Metadata associated with inputs required by the `sbayesrc_impute` process.
    - tidy:
        type: string
        description: Inputs required by the `sbayesrc_impute` process.
    - tidy_qc:
        type: file
        description: Inputs required by the `sbayesrc_impute` process.
    - harmonisation_qc:
        type: file
        description: Inputs required by the `sbayesrc_impute` process.
    - ld_reference:
        type: file
        description: Inputs required by the `sbayesrc_impute` process.
    - ld_reference_files:
        type: list
        description: Inputs required by the `sbayesrc_impute` process.
  - sbayesrc_script:
      type: file
      description: Executable script used to produce sbayesrc wrapper implementation.
output:
  imputed:
    - - meta:
          type: map
          description: Metadata associated with imputed summary statistics and chained qc files.
      - ${meta.trait_id}.imputed.ma:
          type: file
          description: Imputed summary statistics and chained QC files.
      - ${meta.trait_id}.impute_qc.tsv:
          type: file
          description: Imputed summary statistics and chained QC files.
      - tidy_qc:
          type: file
          description: Imputed summary statistics and chained QC files.
      - harmonisation_qc:
          type: file
          description: Imputed summary statistics and chained QC files.
  logs:
    - - meta:
          type: map
          description: Metadata associated with sbayesrc imputation log.
      - ${meta.trait_id}.sbayesrc.impute.log:
          type: file
          description: SBayesRC imputation log.
  versions_sbayesrc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

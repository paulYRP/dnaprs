name: sbayesrc_impute
description: Impute missing GWAS summary statistics to the SBayesRC LD panel using package defaults.
keywords:
  - sbayesrc
  - summary-statistics
  - imputation
tools:
  - sbayesrc:
      description: Bayesian multiple regression using summary statistics
      identifier: ""
      homepage: https://github.com/zhilizheng/SBayesRC
  - R:
      description: Statistical computing environment used by the SBayesRC wrapper
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - - meta:
        type: map
        description: GWAS trait and PRS metadata.
    - tidy:
        type: file
        description: Summary statistics emitted by the SBayesRC tidy stage.
    - tidy_qc:
        type: file
        description: QC summary from the SBayesRC tidy stage.
    - harmonisation_qc:
        type: file
        description: QC summary from GWAS harmonisation.
    - ld_reference:
        type: map
        description: Prepared SBayesRC LD reference metadata.
    - ld_reference_files:
        type: list
        description: Prepared SBayesRC LD reference files.
  - sbayesrc_script:
      type: file
      description: R script that imputes summary statistics with SBayesRC and validates its outputs.
output:
  imputed:
    - - meta:
          type: map
          description: Metadata associated with imputed summary statistics and chained qc files.
      - ${meta.trait_id}.imputed.ma:
          type: file
          description: Imputed summary statistics and chained QC files.
      - ${meta.trait_id}.impute_qc.tsv:
          type: file
          description: Imputed summary statistics and chained QC files.
      - tidy_qc:
          type: file
          description: Imputed summary statistics and chained QC files.
      - harmonisation_qc:
          type: file
          description: Imputed summary statistics and chained QC files.
  logs:
    - - meta:
          type: map
          description: Metadata associated with sbayesrc imputation log.
      - ${meta.trait_id}.sbayesrc.impute.log:
          type: file
          description: SBayesRC imputation log.
  versions_sbayesrc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

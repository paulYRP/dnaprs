name: sbayesrc_model
description: Estimate annotation-informed posterior joint effects with official SBayesRC defaults.
keywords:
  - sbayesrc
  - bayesian
  - prs
tools:
  - sbayesrc:
      description: Bayesian multiple regression using summary statistics
      identifier: ""
      homepage: https://github.com/zhilizheng/SBayesRC
  - R:
      description: Statistical computing environment used by the SBayesRC wrapper
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - - meta:
        type: map
        description: GWAS trait and PRS metadata.
    - imputed:
        type: file
        description: Imputed summary statistics from the SBayesRC impute stage.
    - impute_qc:
        type: file
        description: QC summary from the SBayesRC impute stage.
    - tidy_qc:
        type: file
        description: QC summary from the SBayesRC tidy stage.
    - harmonisation_qc:
        type: file
        description: QC summary from GWAS harmonisation.
    - ld_reference:
        type: map
        description: Prepared SBayesRC LD reference metadata.
    - ld_reference_files:
        type: list
        description: Prepared SBayesRC LD reference files.
    - annotation_reference:
        type: map
        description: Prepared SBayesRC annotation reference metadata.
    - annotation_reference_files:
        type: list
        description: Prepared SBayesRC annotation reference files.
  - sbayesrc_script:
      type: file
      description: R script that fits the SBayesRC model and validates its outputs.
  - seed:
      type: integer
      description: Reproducible model seed.
output:
  model:
    - - meta:
          type: map
          description: Metadata associated with posterior weights, parameters, model qc, and chained qc
            files.
      - ${meta.trait_id}.sbayesrc.txt:
          type: file
          description: Posterior weights, parameters, model QC, and chained QC files.
      - ${meta.trait_id}.sbayesrc.par:
          type: file
          description: Posterior weights, parameters, model QC, and chained QC files.
      - ${meta.trait_id}.sbayesrc.model_qc.tsv:
          type: file
          description: Posterior weights, parameters, model QC, and chained QC files.
      - impute_qc:
          type: file
          description: Posterior weights, parameters, model QC, and chained QC files.
      - tidy_qc:
          type: file
          description: Posterior weights, parameters, model QC, and chained QC files.
      - harmonisation_qc:
          type: file
          description: Posterior weights, parameters, model QC, and chained QC files.
  logs:
    - - meta:
          type: map
          description: Metadata associated with sbayesrc model log.
      - ${meta.trait_id}.sbayesrc.model.log:
          type: file
          description: SBayesRC model log.
  versions_sbayesrc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

name: plink_score
description: Apply fixed clumping-and-thresholding weights to a prepared target using dosage-aware PLINK
  scoring.
keywords:
  - plink
  - scoring
  - prs
tools:
  - plink2:
      description: Whole-genome association and genotype-processing toolset
      identifier: ""
      homepage: https://www.cog-genomics.org/plink/2.0/
input:
  - - target:
        type: map
        description: Target cohort and scoring-stage metadata.
    - target_dir:
        type: directory
        description: Target PGEN dataset used for scoring.
    - target_qc:
        type: file
        description: QC summary for the selected target checkpoint.
    - participant_decisions:
        type: list
        description: Integrated participant eligibility decisions.
    - participant_keep:
        type: file
        description: PLINK keep file for score-eligible participants.
    - gwas:
        type: map
        description: GWAS trait and PRS metadata.
    - weight:
        type: file
        description: C+T score weight table.
    - weight_qc:
        type: file
        description: QC summary for the score weights.
    - harmonisation_qc:
        type: file
        description: GWAS harmonisation and reference-alignment QC summary.
    - clump_log:
        type: file
        description: PLINK clumping execution log.
    - reference:
        type: map
        description: LD reference identifier and build metadata.
    - reference_freq:
        type: file
        description: LD reference allele-frequency table.
    - reference_log:
        type: file
        description: LD reference frequency calculation log.
output:
  raw:
    - - target:
          type: map
          description: Metadata associated with target/gwas metadata, plink score, used variants, log, staged
            weights, and target pvar.
      - gwas:
          type: map
          description: Metadata associated with target/gwas metadata, plink score, used variants, log, staged
            weights, and target pvar.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.sscore":
          type: file
          description: Target/GWAS metadata, PLINK score, used variants, log, staged weights, and target
            PVAR.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.sscore.vars":
          type: file
          description: Target/GWAS metadata, PLINK score, used variants, log, staged weights, and target
            PVAR.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.log":
          type: file
          description: Target/GWAS metadata, PLINK score, used variants, log, staged weights, and target
            PVAR.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.weights.tsv":
          type: file
          description: Target/GWAS metadata, PLINK score, used variants, log, staged weights, and target
            PVAR.
      - "${target.cohort}.${gwas.trait_id}.${target.score_method ?: 'plink_ct'}.target.pvar":
          type: file
          description: Target/GWAS metadata, PLINK score, used variants, log, staged weights, and target
            PVAR.
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

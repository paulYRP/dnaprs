name: prepare_plink_reference
description: Build a European PLINK LD reference from downloaded chromosome reference sources.
keywords:
  - reference
  - plink
  - ld
  - prs
tools:
  - bcftools:
      description: Utilities for variant calling and manipulating VCF and BCF files
      identifier: biotools:bcftools
      homepage: https://samtools.github.io/bcftools/
  - plink2:
      description: Whole-genome association and genotype-processing toolset
      identifier: ""
      homepage: https://www.cog-genomics.org/plink/2.0/
  - unbref3:
      description: Convert a downloaded bref3 reference panel to VCF
      identifier: ""
      homepage: https://faculty.washington.edu/browning/beagle/beagle.html
input:
  - - panel:
        type: map
        description: Population reference panel identifier, type, and source metadata.
    - panel_files:
        type: list
        description: Population reference panel files.
  - - population:
        type: map
        description: Population-label reference metadata.
    - population_files:
        type: list
        description: Sample population and ancestry label files.
  - - related:
        type: map
        description: Related-sample exclusion reference metadata.
    - related_files:
        type: list
        description: Related-sample exclusion files.
  - - unbref3:
        type: map
        description: unbref3 tool reference metadata.
    - unbref3_files:
        type: list
        description: Pinned unbref3 JAR used to convert bref3 input.
  - prepare_script:
      type: file
      description: Shell script that validates and converts the PLINK and ancestry reference panel.
  - genome_build:
      type: string
      description: Target genome build.
output:
  reference:
    - - panel:
          type: map
          description: Metadata associated with prepared plink ld reference.
      - ${panel.reference_id}.plink_ld:
          type: file
          description: Prepared PLINK LD reference.
  summary:
    - - panel:
          type: map
          description: Metadata associated with preparation summary and marker counts.
      - ${panel.reference_id}.plink_ld.summary.tsv:
          type: file
          description: Preparation summary and marker counts.
  source_qc:
    - - panel:
          type: map
          description: Metadata associated with source-reference validation audit.
      - ${panel.reference_id}.plink_ld.source_qc.tsv:
          type: file
          description: Source-reference validation audit.
  logs:
    - - panel:
          type: map
          description: Metadata associated with reference-preparation log.
      - ${panel.reference_id}.plink_ld.prepare.log:
          type: file
          description: Reference-preparation log.
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_unbref3:
    - - ${task.process}:
          type: string
          description: The name of the process
      - unbref3:
          type: string
          description: The name of the tool
      - printf 27Feb25.75f:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - unbref3:
          type: string
          description: The name of the tool
      - printf 27Feb25.75f:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

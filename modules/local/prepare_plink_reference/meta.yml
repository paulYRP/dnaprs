name: prepare_plink_reference
description: Convert one balanced group of reference chromosomes for European and unrelated samples.
keywords:
  - genotype
  - prs
  - reference
tools:
  - "bcftools":
      description: "VCF processing and allele orientation."
      homepage: "https://samtools.github.io/bcftools/"
  - "plink2":
      description: "Genotype conversion and analysis."
      homepage: "https://www.cog-genomics.org/plink/2.0/"
  - "unbref3":
      description: "BREF3 to VCF conversion."
      homepage: "https://faculty.washington.edu/browning/beagle/beagle.html"
input:
  - - "panel":
        type: map
        description: "Reference source metadata, expected chromosomes and group count."
    - "group_id":
        type: string
        description: "Stable reference group identifier."
    - "chromosomes":
        type: list
        description: "Autosomal chromosome numbers assigned to this group."
    - "panel_files":
        type: list
        description: "Source chromosome files assigned to this group."
  - - "population":
        type: map
        description: "Population metadata source record."
    - "population_files":
        type: file
        description: "Sample population metadata table."
  - - "related":
        type: map
        description: "Related-sample exclusion source record."
    - "related_files":
        type: file
        description: "Related-sample exclusion table."
  - - "unbref3":
        type: map
        description: "unbref3 source record."
    - "unbref3_files":
        type: file
        description: "Pinned unbref3 JAR."
  - "prepare_script":
      type: file
      description: "Staged implementation script."
  - "genome_build":
      type: string
      description: "Declared reference build; GRCh37."
output:
  prepared:
    - - "panel":
          type: map
          description: "Reference source metadata, expected chromosomes and group count."
      - "group_id":
          type: string
          description: "Stable reference group identifier."
      - "${panel.reference_id}.group${group_id}":
          type: directory
          description: "European and unrelated reference PGEN files for the declared chromosomes."
      - "${panel.reference_id}.group${group_id}.source_qc.tsv":
          type: file
          description: "Chromosome preparation counts and source SHA-256 checksums."
      - "${panel.reference_id}.group${group_id}.prepare.log":
          type: file
          description: "Reference conversion and preparation diagnostics, including Java runtime warnings and errors."
  versions_bcftools:
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "bcftools":
          type: string
          description: "Recorded value."
      - "command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub":
          type: eval
          description: "Command that reports the software version."
  versions_plink2:
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "plink2":
          type: string
          description: "Recorded value."
      - "command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub":
          type: eval
          description: "Command that reports the software version."
  versions_unbref3:
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "unbref3":
          type: map
          description: "unbref3 source record."
      - "printf 27Feb25.75f":
          type: eval
          description: "Command that reports the software version."
topics:
  versions:
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "bcftools":
          type: string
          description: "Recorded value."
      - "command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub":
          type: eval
          description: "Command that reports the software version."
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "plink2":
          type: string
          description: "Recorded value."
      - "command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub":
          type: eval
          description: "Command that reports the software version."
    - - "${task.process}":
          type: string
          description: "Fully qualified process name."
      - "unbref3":
          type: map
          description: "unbref3 source record."
      - "printf 27Feb25.75f":
          type: eval
          description: "Command that reports the software version."
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

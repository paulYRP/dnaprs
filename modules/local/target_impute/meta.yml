name: target_impute_chromosome
description: Phase and impute one target chromosome with Beagle and retain typed or high-DR2 variants.
keywords:
  - genotype
  - imputation
  - beagle
tools:
  - beagle:
      description: Genotype phasing and imputation
      homepage: https://faculty.washington.edu/browning/beagle/beagle.html
      identifier: biotools:beagle-lib
  - bcftools:
      description: Variant calling and manipulation toolkit
      homepage: https://samtools.github.io/bcftools/
      identifier: biotools:bcftools
  - plink2:
      description: Whole-genome association and genotype-processing toolset
      identifier: ""
      homepage: https://www.cog-genomics.org/plink/2.0/
input:
  - - group_key:
        type: map
        description: Target cohort metadata shared across chromosome tasks.
    - chromosome:
        type: string
        description: Chromosome imputed by this task.
    - target_pgen:
        type: file
        description: Target PGEN file for the selected chromosome.
    - target_pvar:
        type: file
        description: Target PVAR file for the selected chromosome.
    - target_psam:
        type: file
        description: Target PSAM file for the selected chromosome.
    - target_qc:
        type: file
        description: Target QC summary associated with the imputation checkpoint.
    - panel:
        type: map
        description: Imputation reference panel metadata for the selected chromosome.
    - panel_files:
        type: list
        description: Imputation reference panel files for the selected chromosome.
    - genetic_map:
        type: map
        description: Genetic map metadata for the selected chromosome.
    - genetic_map_files:
        type: list
        description: Genetic map files for the selected chromosome.
    - beagle:
        type: map
        description: Beagle tool reference metadata.
    - beagle_files:
        type: list
        description: Pinned Beagle JAR.
    - reference_fasta:
        type: map
        description: Reference genome metadata.
    - reference_fasta_files:
        type: list
        description: Reference FASTA and index files.
  - impute_script:
      type: file
      description: Shell script that phases, imputes, filters, and converts one chromosome.
  - imputation_dr2:
      type: float
      description: Minimum imputation dosage quality retained.
output:
  chromosomes:
    - - group_key:
          type: directory
          description: Metadata associated with one chromosome-level imputed pgen and vcf checkpoint.
      - chromosome:
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputed":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputation_manifest.tsv":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputation_qc.tsv":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputation_dr2.tsv":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.target_imputation.log":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
  versions_beagle:
    - - ${task.process}:
          type: string
          description: The name of the process
      - beagle:
          type: string
          description: The name of the tool
      - printf 27Feb25.75f:
          type: eval
          description: The expression to obtain the version of the tool
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - beagle:
          type: string
          description: The name of the tool
      - printf 27Feb25.75f:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

name: target_impute_chromosome
description: Phase and impute one target chromosome with Beagle and retain typed or high-DR2 variants.
keywords:
  - genotype
  - imputation
  - beagle
tools:
  - beagle:
      description: Genotype phasing and imputation
      homepage: https://faculty.washington.edu/browning/beagle/beagle.html
      identifier: biotools:beagle-lib
  - bcftools:
      description: Variant calling and manipulation toolkit
      homepage: https://samtools.github.io/bcftools/
      identifier: biotools:bcftools
  - plink2:
      description: Software dependency reported by the `target_impute` process
      identifier: ""
      homepage: https://www.cog-genomics.org/plink/2.0/
input:
  - - group_key:
        type: map
        description: Metadata associated with inputs required by the `target_impute` process.
    - chromosome:
        type: string
        description: Inputs required by the `target_impute` process.
    - target_pgen:
        type: file
        description: Inputs required by the `target_impute` process.
    - target_pvar:
        type: file
        description: Inputs required by the `target_impute` process.
    - target_psam:
        type: file
        description: Inputs required by the `target_impute` process.
    - target_qc:
        type: file
        description: Inputs required by the `target_impute` process.
    - panel:
        type: map
        description: Metadata associated with inputs required by the `target_impute` process.
    - panel_files:
        type: list
        description: Inputs required by the `target_impute` process.
    - genetic_map:
        type: map
        description: Metadata associated with inputs required by the `target_impute` process.
    - genetic_map_files:
        type: list
        description: Inputs required by the `target_impute` process.
    - beagle:
        type: map
        description: Metadata associated with inputs required by the `target_impute` process.
    - beagle_files:
        type: list
        description: Inputs required by the `target_impute` process.
    - reference_fasta:
        type: map
        description: Metadata associated with inputs required by the `target_impute` process.
    - reference_fasta_files:
        type: list
        description: Inputs required by the `target_impute` process.
  - impute_script:
      type: file
      description: Executable script used to produce chromosome imputation implementation.
  - imputation_dr2:
      type: string
      description: Minimum imputation dosage quality retained.
output:
  chromosomes:
    - - group_key:
          type: directory
          description: Metadata associated with one chromosome-level imputed pgen and vcf checkpoint.
      - chromosome:
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputed":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputation_manifest.tsv":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputation_qc.tsv":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.imputation_dr2.tsv":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
      - "*.chr*.target_imputation.log":
          type: directory
          description: One chromosome-level imputed PGEN and VCF checkpoint.
  versions_beagle:
    - - ${task.process}:
          type: string
          description: The name of the process
      - beagle:
          type: string
          description: The name of the tool
      - printf 27Feb25.75f:
          type: eval
          description: The expression to obtain the version of the tool
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - beagle:
          type: string
          description: The name of the tool
      - printf 27Feb25.75f:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - bcftools:
          type: string
          description: The name of the tool
      - command -v bcftools >/dev/null && bcftools --version 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

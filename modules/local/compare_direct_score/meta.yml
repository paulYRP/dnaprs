name: compare_direct_score
description: Compare imputed and direct-genotype PLINK scores and their variant coverage.
keywords:
  - prs
  - sensitivity
  - plink
tools:
  - R:
      description: Statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - - target:
        type: map
        description: Target cohort and primary scoring-stage metadata.
    - gwas:
        type: map
        description: GWAS trait and PRS metadata.
    - primary_score:
        type: file
        description: Participant scores from the primary imputed target.
    - primary_used:
        type: file
        description: Scoring variants used for the primary imputed target.
    - direct_score:
        type: file
        description: Participant scores from the direct-genotype sensitivity target.
    - direct_used:
        type: file
        description: Scoring variants used for the direct-genotype sensitivity target.
  - comparison_script:
      type: file
      description: R script that compares primary and direct-genotype scores and variant coverage.
output:
  comparison:
    - - target:
          type: map
          description: Metadata associated with participant-level and summary sensitivity results.
      - gwas:
          type: map
          description: Metadata associated with participant-level and summary sensitivity results.
      - ${target.cohort}.${gwas.trait_id}.plink_ct.sensitivity.tsv:
          type: file
          description: Participant-level and summary sensitivity results.
      - ${target.cohort}.${gwas.trait_id}.plink_ct.sensitivity_qc.tsv:
          type: file
          description: Participant-level and summary sensitivity results.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:

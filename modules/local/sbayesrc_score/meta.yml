name: sbayesrc_score
description: Apply posterior SBayesRC weights with the official prs function and no target-derived centring.
keywords:
  - sbayesrc
  - plink
  - scoring
  - prs
tools:
  - sbayesrc:
      description: Bayesian multiple regression using summary statistics
      identifier: ""
      homepage: https://github.com/zhilizheng/SBayesRC
  - plink2:
      description: Whole-genome association and genotype-processing toolset
      identifier: ""
      homepage: https://www.cog-genomics.org/plink/2.0/
  - R:
      description: Software dependency reported by the `sbayesrc_score` process
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - - target:
        type: map
        description: Metadata associated with inputs required by the `sbayesrc_score` process.
    - target_dir:
        type: string
        description: Inputs required by the `sbayesrc_score` process.
    - target_qc:
        type: file
        description: Inputs required by the `sbayesrc_score` process.
    - participant_decisions:
        type: list
        description: Inputs required by the `sbayesrc_score` process.
    - participant_keep:
        type: string
        description: Inputs required by the `sbayesrc_score` process.
    - gwas:
        type: map
        description: Metadata associated with inputs required by the `sbayesrc_score` process.
    - weight:
        type: file
        description: Inputs required by the `sbayesrc_score` process.
    - parameter:
        type: string
        description: Inputs required by the `sbayesrc_score` process.
    - model_qc:
        type: file
        description: Inputs required by the `sbayesrc_score` process.
    - impute_qc:
        type: file
        description: Inputs required by the `sbayesrc_score` process.
    - tidy_qc:
        type: file
        description: Inputs required by the `sbayesrc_score` process.
    - harmonisation_qc:
        type: file
        description: Inputs required by the `sbayesrc_score` process.
  - sbayesrc_script:
      type: file
      description: Executable script used to produce sbayesrc wrapper implementation.
output:
  scores:
    - - target:
          type: map
          description: Metadata associated with participant scores and score-coverage qc.
      - gwas:
          type: map
          description: Metadata associated with participant scores and score-coverage qc.
      - ${target.cohort}.${gwas.trait_id}.sbayesrc.score.tsv:
          type: file
          description: Participant scores and score-coverage QC.
      - ${target.cohort}.${gwas.trait_id}.sbayesrc.score_qc.tsv:
          type: file
          description: Participant scores and score-coverage QC.
  logs:
    - - target:
          type: map
          description: Metadata associated with sbayesrc scoring log.
      - gwas:
          type: map
          description: Metadata associated with sbayesrc scoring log.
      - ${target.cohort}.${gwas.trait_id}.sbayesrc.score.log:
          type: file
          description: SBayesRC scoring log.
  versions_sbayesrc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - command -v plink2 >/dev/null && plink2 --version 2>&1 | head -n 1 | cut -d ' ' -f 2 | sed 's/^v//' || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

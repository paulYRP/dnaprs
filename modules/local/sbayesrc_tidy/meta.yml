name: sbayesrc_tidy
description: Align COJO summary statistics to the official SBayesRC LD reference.
keywords:
  - sbayesrc
  - gwas
  - ld
tools:
  - sbayesrc:
      description: Bayesian multiple regression using summary statistics
      identifier: ""
      homepage: https://github.com/zhilizheng/SBayesRC
  - R:
      description: Software dependency reported by the `sbayesrc_tidy` process
      identifier: ""
      homepage: https://www.r-project.org/
input:
  - - meta:
        type: map
        description: Metadata associated with inputs required by the `sbayesrc_tidy` process.
    - cojo:
        type: file
        description: Inputs required by the `sbayesrc_tidy` process.
    - clump_input:
        type: file
        description: Inputs required by the `sbayesrc_tidy` process.
    - harmonisation_qc:
        type: file
        description: Inputs required by the `sbayesrc_tidy` process.
    - ld_reference:
        type: file
        description: Inputs required by the `sbayesrc_tidy` process.
    - ld_reference_files:
        type: list
        description: Inputs required by the `sbayesrc_tidy` process.
  - sbayesrc_script:
      type: file
      description: Executable script used to produce sbayesrc wrapper implementation.
output:
  tidy:
    - - meta:
          type: map
          description: Metadata associated with ld-aligned summary statistics and chained qc.
      - ${meta.trait_id}.tidy.ma:
          type: file
          description: LD-aligned summary statistics and chained QC.
      - ${meta.trait_id}.tidy_qc.tsv:
          type: file
          description: LD-aligned summary statistics and chained QC.
      - harmonisation_qc:
          type: file
          description: LD-aligned summary statistics and chained QC.
  logs:
    - - meta:
          type: map
          description: Metadata associated with sbayesrc tidy-stage log.
      - ${meta.trait_id}.sbayesrc.tidy.log:
          type: file
          description: SBayesRC tidy-stage log.
  versions_sbayesrc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - SBayesRC:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("SBayesRC")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@paulYRP"
maintainers:
  - "@paulYRP"

name: build_ct_weights
description: Create an allele-explicit PLINK score file from fixed LD-clumped variants.
keywords:
  - plink
  - weights
  - prs
tools:
  - r:
      description: R statistical computing environment
      identifier: ""
      homepage: https://www.r-project.org/
  - data.table:
      description: High-performance tabular data processing in R
      identifier: ""
      homepage: https://r-datatable.com/
input:
  - - meta:
        type: map
        description: GWAS trait and PRS metadata.
    - cojo:
        type: file
        description: Reference-aligned GWAS table in COJO format.
    - clumps:
        type: file
        description: PLINK clump assignments for retained index variants.
    - harmonisation_qc:
        type: file
        description: QC summary from GWAS harmonisation and reference alignment.
    - clump_log:
        type: file
        description: PLINK clumping execution log.
  - weight_script:
      type: file
      description: R script that creates C+T score weights from aligned clumps.
output:
  weights:
    - - meta:
          type: map
          description: Metadata associated with allele-explicit score weights, qc, and upstream audit files.
      - ${meta.trait_id}.plink_ct.weights.tsv:
          type: file
          description: Allele-explicit score weights, QC, and upstream audit files.
      - ${meta.trait_id}.plink_ct.weight_qc.tsv:
          type: file
          description: Allele-explicit score weights, QC, and upstream audit files.
      - harmonisation_qc:
          type: file
          description: Allele-explicit score weights, QC, and upstream audit files.
      - clump_log:
          type: file
          description: Allele-explicit score weights, QC, and upstream audit files.
  versions_r:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
  versions_data_table:
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - R:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(getRversion()))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - data.table:
          type: string
          description: The name of the tool
      - Rscript -e 'cat(as.character(packageVersion("data.table")))' 2>/dev/null || printf stub:
          type: eval
          description: The expression to obtain the version of the tool
authors:
